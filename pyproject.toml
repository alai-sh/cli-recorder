[build-system]
requires = ["uv_build >= 0.9, < 0.14"]
build-backend = "uv_build"

[project]
name = "cli-recorder"
version = "0.1.0"
description = "Records a command line's terminal sessions and writes its CLI reference for a Zensical site."
readme = "README.md"
# MIT for our code, Apache-2.0 for the vendored asciinema-player in assets/.
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "src/cli_recorder/assets/asciinema-player/LICENSE"]
authors = [{ name = "Jordan Borean" }]
# Only ever run by a docs build, which uses the newest Python.
requires-python = ">=3.15"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Documentation",
]
dependencies = []

[project.urls]
Source = "https://github.com/alai-sh/cli-recorder"

[dependency-groups]
dev = [
    "basedpyright >= 1.40.2",
    "pytest >= 8",
    "ruff >= 0.17.0",
]

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.15"
reportAny = false
reportExplicitAny = false
reportImplicitOverride = false
reportPrivateUsage = false
reportUnannotatedClassAttribute = false
reportUnknownArgumentType = false
reportUnknownMemberType = false
reportUnusedCallResult = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["A", "B", "C4", "E4", "E7", "E9", "F", "FURB", "I", "PERF", "PIE", "RET", "RUF", "S", "SIM", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = "tests"
